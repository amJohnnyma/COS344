<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scene Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0e0e14; --panel: #13131d; --border: #22223a;
    --accent: #00e5ff; --accent2: #ff4d6d; --text: #c8c8e0;
    --dim: #44445a; --font: 'JetBrains Mono', monospace;
  }
  body { background:var(--bg); color:var(--text); font-family:var(--font); font-size:12px; display:flex; flex-direction:column; height:100vh; overflow:hidden; }

  header { display:flex; align-items:center; gap:16px; padding:8px 16px; border-bottom:1px solid var(--border); background:var(--panel); flex-shrink:0; }
  header h1 { font-size:11px; font-weight:600; letter-spacing:3px; color:var(--accent); text-transform:uppercase; }
  .hint { font-size:10px; color:var(--dim); }
  .coord-pill { margin-left:auto; background:#0a0a12; border:1px solid var(--border); border-radius:20px; padding:3px 12px; font-size:10px; color:var(--dim); }
  .coord-pill b { color:var(--accent); }

  .main { display:flex; flex:1; overflow:hidden; }
  .canvas-wrap { flex:1; position:relative; overflow:hidden; background:#090910; }
  canvas { display:block; }

  .sidebar { width:300px; flex-shrink:0; border-left:1px solid var(--border); display:flex; flex-direction:column; background:var(--panel); overflow:hidden; }

  .add-form { padding:12px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .add-form h2 { font-size:9px; letter-spacing:2px; color:var(--dim); margin-bottom:10px; text-transform:uppercase; }

  .form-row { display:flex; gap:6px; margin-bottom:6px; align-items:center; }
  .form-row label { font-size:10px; color:var(--dim); width:44px; flex-shrink:0; }

  input[type=text], input[type=number] {
    background:#0a0a12; border:1px solid var(--border); color:var(--text);
    font-family:var(--font); font-size:11px; padding:4px 7px; border-radius:3px;
    flex:1; min-width:0; outline:none; transition:border-color 0.15s;
  }
  input:focus { border-color:var(--accent); }
  input[type=color] { width:32px; height:26px; border:1px solid var(--border); border-radius:3px; background:none; padding:1px; cursor:pointer; flex-shrink:0; }

  .btn { width:100%; padding:7px; background:var(--accent); color:#000; border:none; border-radius:3px; font-family:var(--font); font-size:11px; font-weight:600; letter-spacing:1px; cursor:pointer; margin-top:6px; transition:opacity 0.15s; }
  .btn:hover { opacity:0.85; }

  .type-tabs { display:flex; gap:4px; margin-bottom:8px; }
  .tab { flex:1; padding:5px; text-align:center; border:1px solid var(--border); border-radius:3px; cursor:pointer; font-size:10px; color:var(--dim); transition:all 0.15s; }
  .tab.active { border-color:var(--accent); color:var(--accent); background:#00e5ff11; }

  .inspector { padding:12px; border-bottom:1px solid var(--border); flex-shrink:0; display:none; background:#0f0f1a; }
  .inspector.visible { display:block; }
  .inspector h2 { font-size:9px; letter-spacing:2px; color:var(--accent); margin-bottom:10px; text-transform:uppercase; }
  .insp-row { display:flex; gap:6px; margin-bottom:5px; align-items:center; }
  .insp-row label { font-size:10px; color:var(--dim); width:44px; flex-shrink:0; }
  .insp-row input { background:#0a0a12; border:1px solid var(--border); color:var(--text); font-family:var(--font); font-size:11px; padding:3px 6px; border-radius:3px; flex:1; min-width:0; outline:none; }
  .insp-row input:focus { border-color:var(--accent); }

  .shape-list { flex:1; overflow-y:auto; padding:8px; }
  .shape-list h2 { font-size:9px; letter-spacing:2px; color:var(--dim); margin-bottom:8px; text-transform:uppercase; padding:0 4px; }

  .shape-card { border:1px solid var(--border); border-radius:4px; padding:8px 10px; margin-bottom:5px; cursor:pointer; transition:all 0.12s; display:flex; align-items:center; gap:8px; }
  .shape-card:hover { border-color:#333355; background:#15152a; }
  .shape-card.selected { border-color:var(--accent); background:#00e5ff0a; }
  .swatch { width:12px; height:12px; border-radius:2px; flex-shrink:0; border:1px solid #ffffff22; }
  .card-info { flex:1; min-width:0; }
  .card-name { color:#ddd; font-size:11px; font-weight:600; }
  .card-sub { color:var(--dim); font-size:10px; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .del-btn { background:none; border:none; color:var(--dim); cursor:pointer; font-size:14px; line-height:1; padding:2px 4px; border-radius:3px; transition:color 0.15s; }
  .del-btn:hover { color:#ff4d6d; }
  .empty-hint { color:var(--dim); font-size:10px; text-align:center; padding:20px; line-height:2; }

  .shape-list::-webkit-scrollbar { width:4px; }
  .shape-list::-webkit-scrollbar-track { background:transparent; }
  .shape-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
</style>
</head>
<body>

<header>
  <h1>⬛ Scene Editor</h1>
  <span class="hint">drag to move · drag handles to resize · scroll to zoom</span>
  <div class="coord-pill" id="coordPill">x: <b>—</b> &nbsp; y: <b>—</b></div>
</header>

<div class="main">
  <div class="canvas-wrap">
    <canvas id="c"></canvas>
  </div>

  <div class="sidebar">
    <!-- Inspector -->
    <div class="inspector" id="inspector">
      <h2 id="inspTitle">Inspector</h2>
      <div class="insp-row"><label>name</label><input id="iName" oninput="updateSelected('name',this.value)"/></div>
      <div class="insp-row">
        <label>x</label><input type="number" id="iX" step="0.1" oninput="updateSelected('cx',+this.value)"/>
        <label style="width:20px;text-align:center">y</label><input type="number" id="iY" step="0.1" oninput="updateSelected('cy',+this.value)"/>
      </div>
      <div class="insp-row"><label>z</label><input type="number" id="iZ" step="1" oninput="updateSelected('z',+this.value)"/></div>
      <div id="iRectFields">
        <div class="insp-row"><label>height</label><input type="number" id="iH" step="0.1" min="0.01" oninput="updateSelected('h',+this.value)"/></div>
        <div class="insp-row"><label>width</label><input type="number" id="iW" step="0.1" min="0.01" oninput="updateSelected('w',+this.value)"/></div>
        <div class="insp-row"><label>rot°</label><input type="number" id="iRot" step="1" oninput="updateSelected('rot',+this.value)"/></div>
      </div>
      <div id="iCircleFields" style="display:none">
        <div class="insp-row"><label>radius</label><input type="number" id="iR" step="0.05" min="0.01" oninput="updateSelected('r',+this.value)"/></div>
      </div>
      <div class="insp-row">
        <label>color</label>
        <input type="color" id="iColor" oninput="updateSelected('color',this.value);document.getElementById('iColorHex').value=this.value"/>
        <input type="text" id="iColorHex" placeholder="#rrggbb" oninput="if(/^#[0-9a-fA-F]{6}$/.test(this.value)){updateSelected('color',this.value);document.getElementById('iColor').value=this.value}"/>
      </div>
    </div>

    <!-- Add form -->
    <div class="add-form">
      <h2>Add Shape</h2>
      <div class="type-tabs">
        <div class="tab active" id="tabRect" onclick="setType('rect')">Square / Rect</div>
        <div class="tab" id="tabCircle" onclick="setType('circle')">Circle</div>
      </div>
      <div class="form-row"><label>name</label><input type="text" id="fName" placeholder="myShape"/></div>
      <div class="form-row">
        <label>x, y</label>
        <input type="number" id="fX" placeholder="0" step="0.5" style="flex:1"/>
        <input type="number" id="fY" placeholder="0" step="0.5" style="flex:1"/>
      </div>
      <div class="form-row"><label>z</label><input type="number" id="fZ" placeholder="0" step="1"/></div>
      <div id="rectFields">
        <div class="form-row">
          <label>h, w</label>
          <input type="number" id="fH" placeholder="height" step="0.5" style="flex:1"/>
          <input type="number" id="fW" placeholder="width" step="0.5" style="flex:1"/>
        </div>
        <div class="form-row"><label>rot°</label><input type="number" id="fRot" placeholder="0" step="1"/></div>
      </div>
      <div id="circleFields" style="display:none">
        <div class="form-row"><label>radius</label><input type="number" id="fR" placeholder="1" step="0.1"/></div>
      </div>
      <div class="form-row">
        <label>color</label>
        <input type="color" id="fColor" value="#22aa44"/>
        <input type="text" id="fColorHex" placeholder="#22aa44" style="flex:1"/>
      </div>
      <button class="btn" onclick="addShape()">+ Add Shape</button>
    </div>

    <div class="shape-list">
      <h2>Shapes (<span id="shapeCount">0</span>)</h2>
      <div id="shapeList"></div>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let shapes = [
  { id:uid(), name:'background',       type:'rect',   cx:0,  cy:0,  z:0, h:16,  w:21,  rot:0,   color:'#404040' },
  { id:uid(), name:'courseGrass',      type:'rect',   cx:0,  cy:0,  z:0, h:13,  w:18,  rot:0,   color:'#228B22' },
  { id:uid(), name:'reboundObstacle1', type:'rect',   cx:-8, cy:-5, z:1, h:0.5, w:2.5, rot:-45, color:'#7B3F00' },
  { id:uid(), name:'reboundObstacle2', type:'rect',   cx:-8, cy:5,  z:1, h:0.5, w:2.5, rot:45,  color:'#7B3F00' },
  { id:uid(), name:'reboundObstacle3', type:'rect',   cx:3,  cy:0,  z:1, h:1,   w:12,  rot:0,   color:'#7B3F00' },
  { id:uid(), name:'startPos',         type:'rect',   cx:8,  cy:-4, z:0, h:3,   w:1,   rot:0,   color:'#FF00FF' },
  { id:uid(), name:'ball',             type:'circle', cx:7,  cy:-3, z:1, r:0.3,               color:'#FFFFFF'  },
];
let selectedId = null;
let curType = 'rect';
let drag = null;  // { mode:'move'|'handle', shapeId, handle, lastX, lastY }
let mouse = null;

function uid() { return Math.random().toString(36).slice(2,8); }
function getShape(id) { return shapes.find(s=>s.id===id); }

// ── Canvas ─────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let SCALE = 30, OX, OY;
const HANDLE_R = 5;

function resize() {
  const wrap = canvas.parentElement;
  canvas.width = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  OX = canvas.width/2; OY = canvas.height/2;
  draw();
}
window.addEventListener('resize', resize);
function toCanvas(wx,wy){ return {x: OX+wx*SCALE, y: OY-wy*SCALE}; }
function toWorld(cx,cy) { return {x:(cx-OX)/SCALE, y:-(cy-OY)/SCALE}; }

// ── Handles ────────────────────────────────────────────────────────────────
function getHandles(s) {
  if(s.type==='circle'){
    const p=toCanvas(s.cx, s.cy);
    return [{ id:'r', cx:p.x+s.r*SCALE, cy:p.y }];
  }
  const hw=s.w/2, hh=s.h/2;
  const rad=(s.rot||0)*Math.PI/180;
  function rotPt(lx,ly){ return { wx: s.cx+lx*Math.cos(rad)-ly*Math.sin(rad), wy: s.cy+lx*Math.sin(rad)+ly*Math.cos(rad) }; }
  return [
    { id:'n',  ...rotPt(0,    hh) },
    { id:'s',  ...rotPt(0,   -hh) },
    { id:'e',  ...rotPt(hw,    0) },
    { id:'w',  ...rotPt(-hw,   0) },
    { id:'ne', ...rotPt(hw,   hh) },
    { id:'nw', ...rotPt(-hw,  hh) },
    { id:'se', ...rotPt(hw,  -hh) },
    { id:'sw', ...rotPt(-hw, -hh) },
  ];
}

// ── Draw ───────────────────────────────────────────────────────────────────
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Grid
  ctx.strokeStyle='#15151f'; ctx.lineWidth=1;
  for(let x=OX%SCALE; x<canvas.width; x+=SCALE){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke(); }
  for(let y=OY%SCALE; y<canvas.height; y+=SCALE){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke(); }

  // Axes
  ctx.strokeStyle='#252535'; ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(0,OY);ctx.lineTo(canvas.width,OY);ctx.stroke();
  ctx.beginPath();ctx.moveTo(OX,0);ctx.lineTo(OX,canvas.height);ctx.stroke();

  // Axis labels
  ctx.fillStyle='#2a2a40'; ctx.font='9px JetBrains Mono'; ctx.textAlign='center';
  for(let wx=-20;wx<=20;wx++){
    if(!wx) continue; const cx=OX+wx*SCALE; if(cx<10||cx>canvas.width-10) continue;
    ctx.fillText(wx,cx,OY+11);
  }
  ctx.textAlign='right';
  for(let wy=-15;wy<=15;wy++){
    if(!wy) continue; const cy=OY-wy*SCALE; if(cy<10||cy>canvas.height-10) continue;
    ctx.fillText(wy,OX-4,cy+3);
  }

  // Shapes
  const sorted=[...shapes].sort((a,b)=>a.z-b.z);
  for(const s of sorted){
    const sel=s.id===selectedId;
    ctx.globalAlpha = selectedId&&!sel ? 0.3 : 0.85;

    if(s.type==='rect'){
      const p=toCanvas(s.cx,s.cy);
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate((s.rot||0)*Math.PI/180);
      ctx.fillStyle=s.color;
      ctx.fillRect(-s.w/2*SCALE,-s.h/2*SCALE,s.w*SCALE,s.h*SCALE);
      ctx.globalAlpha=1;
      ctx.strokeStyle=sel?'#00e5ff':'#ffffff22'; ctx.lineWidth=sel?2:1;
      ctx.strokeRect(-s.w/2*SCALE,-s.h/2*SCALE,s.w*SCALE,s.h*SCALE);
      ctx.restore();
      ctx.globalAlpha=sel?1:0.5;
      ctx.fillStyle=sel?'#00e5ff':'#ffffff44';
      ctx.beginPath(); ctx.arc(p.x,p.y,2.5,0,Math.PI*2); ctx.fill();
    } else {
      const p=toCanvas(s.cx,s.cy);
      ctx.beginPath(); ctx.arc(p.x,p.y,s.r*SCALE,0,Math.PI*2);
      ctx.fillStyle=s.color; ctx.fill();
      ctx.globalAlpha=1;
      ctx.strokeStyle=sel?'#00e5ff':'#ffffff22'; ctx.lineWidth=sel?2:1; ctx.stroke();
    }

    // Label
    ctx.globalAlpha=sel?1:0.6;
    ctx.font=`${sel?'bold ':''} 9px JetBrains Mono`;
    ctx.fillStyle=sel?'#00e5ff':'#aaaacc'; ctx.textAlign='center';
    const lp=toCanvas(s.cx,s.cy);
    ctx.fillText(s.name, lp.x, lp.y-(s.type==='circle'?s.r*SCALE:s.h/2*SCALE)-5);
  }
  ctx.globalAlpha=1;

  // Resize handles for selected shape
  if(selectedId){
    const s=getShape(selectedId);
    if(s){
      for(const h of getHandles(s)){
        let cx,cy;
        if(s.type==='circle'){ cx=h.cx; cy=h.cy; }
        else { const p=toCanvas(h.wx,h.wy); cx=p.x; cy=p.y; }
        ctx.beginPath(); ctx.arc(cx,cy,HANDLE_R+1,0,Math.PI*2); ctx.fillStyle='#0e0e14'; ctx.fill();
        ctx.beginPath(); ctx.arc(cx,cy,HANDLE_R,0,Math.PI*2); ctx.fillStyle='#00e5ff'; ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke();
      }
    }
  }

  // Crosshair
  if(mouse&&!drag){
    const mp=toCanvas(mouse.x,mouse.y);
    ctx.strokeStyle='#00e5ff22'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath();ctx.moveTo(mp.x,0);ctx.lineTo(mp.x,canvas.height);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,mp.y);ctx.lineTo(canvas.width,mp.y);ctx.stroke();
    ctx.setLineDash([]);
  }
}

// ── Hit testing ────────────────────────────────────────────────────────────
function hitHandle(wx, wy) {
  if(!selectedId) return null;
  const s=getShape(selectedId); if(!s) return null;
  const mp=toCanvas(wx,wy);
  for(const h of getHandles(s)){
    let hcx,hcy;
    if(s.type==='circle'){ hcx=h.cx; hcy=h.cy; }
    else { const p=toCanvas(h.wx,h.wy); hcx=p.x; hcy=p.y; }
    const dx=mp.x-hcx, dy=mp.y-hcy;
    if(Math.sqrt(dx*dx+dy*dy)<=HANDLE_R+3) return h.id;
  }
  return null;
}

function hitShape(wx, wy) {
  const sorted=[...shapes].sort((a,b)=>b.z-a.z);
  for(const s of sorted){
    if(s.type==='circle'){
      const dx=wx-s.cx, dy=wy-s.cy;
      if(Math.sqrt(dx*dx+dy*dy)<=s.r) return s.id;
    } else {
      const rad=-(s.rot||0)*Math.PI/180;
      const lx=(wx-s.cx)*Math.cos(rad)-(wy-s.cy)*Math.sin(rad);
      const ly=(wx-s.cx)*Math.sin(rad)+(wy-s.cy)*Math.cos(rad);
      if(Math.abs(lx)<=s.w/2&&Math.abs(ly)<=s.h/2) return s.id;
    }
  }
  return null;
}

function getCursor(wx, wy) {
  const h=hitHandle(wx,wy);
  if(h){
    if(h==='r') return 'ew-resize';
    if(h==='n'||h==='s') return 'ns-resize';
    if(h==='e'||h==='w') return 'ew-resize';
    if(h==='ne'||h==='sw') return 'nesw-resize';
    if(h==='nw'||h==='se') return 'nwse-resize';
  }
  if(hitShape(wx,wy)) return 'grab';
  return 'crosshair';
}

// ── Mouse ──────────────────────────────────────────────────────────────────
canvas.addEventListener('mousemove', e => {
  const r=canvas.getBoundingClientRect();
  const w=toWorld(e.clientX-r.left, e.clientY-r.top);
  mouse=w;
  document.getElementById('coordPill').innerHTML=`x: <b>${w.x.toFixed(2)}</b> &nbsp; y: <b>${w.y.toFixed(2)}</b>`;

  if(drag){
    const s=getShape(drag.shapeId); if(!s){ drag=null; return; }
    const dx=w.x-drag.lastX, dy=w.y-drag.lastY;

    if(drag.mode==='move'){
      s.cx+=dx; s.cy+=dy;
    } else {
      const h=drag.handle;
      if(s.type==='circle'){
        s.r=Math.max(0.05, Math.sqrt((w.x-s.cx)**2+(w.y-s.cy)**2));
      } else {
        // Project mouse delta onto shape's local axes
        const rad=(s.rot||0)*Math.PI/180;
        const lx= dx*Math.cos(rad)+dy*Math.sin(rad);   // along local width axis
        const ly=-dx*Math.sin(rad)+dy*Math.cos(rad);   // along local height axis (canvas: down=positive, but world: up=positive)

        // Width handles (E/W)
        if(h==='e'||h==='ne'||h==='se'){ const dw=lx; s.w=Math.max(0.05,s.w+dw); s.cx+=dw/2*Math.cos(rad); s.cy+=dw/2*Math.sin(rad); }
        if(h==='w'||h==='nw'||h==='sw'){ const dw=-lx; s.w=Math.max(0.05,s.w+dw); s.cx-=dw/2*Math.cos(rad); s.cy-=dw/2*Math.sin(rad); }
        // Height handles (N/S) — in world space, N=+y=canvas up=-ly
        if(h==='n'||h==='ne'||h==='nw'){ const dh=-ly; s.h=Math.max(0.05,s.h+dh); s.cx+=dh/2*Math.sin(rad); s.cy-=dh/2*Math.cos(rad); }
        if(h==='s'||h==='se'||h==='sw'){ const dh=ly; s.h=Math.max(0.05,s.h+dh); s.cx-=dh/2*Math.sin(rad); s.cy+=dh/2*Math.cos(rad); }
      }
    }

    drag.lastX=w.x; drag.lastY=w.y;
    ['cx','cy','w','h','r'].forEach(k=>{ if(s[k]!==undefined) s[k]=Math.round(s[k]*100)/100; });
    refreshInspector(); buildList(); draw();
  } else {
    canvas.style.cursor=getCursor(w.x,w.y);
    draw();
  }
});

canvas.addEventListener('mousedown', e => {
  if(e.button!==0) return;
  const r=canvas.getBoundingClientRect();
  const w=toWorld(e.clientX-r.left, e.clientY-r.top);

  const h=hitHandle(w.x,w.y);
  if(h&&selectedId){
    drag={mode:'handle', handle:h, shapeId:selectedId, lastX:w.x, lastY:w.y};
    canvas.style.cursor='grabbing';
    return;
  }

  const hit=hitShape(w.x,w.y);
  if(hit){
    selectedId=hit;
    drag={mode:'move', shapeId:hit, lastX:w.x, lastY:w.y};
    canvas.style.cursor='grabbing';
    buildList(); refreshInspector(); draw();
    return;
  }

  selectedId=null;
  buildList(); refreshInspector(); draw();
});

canvas.addEventListener('mouseup', ()=>{ drag=null; });
canvas.addEventListener('mouseleave', ()=>{ mouse=null; drag=null; document.getElementById('coordPill').innerHTML=`x: <b>—</b> &nbsp; y: <b>—</b>`; draw(); });
canvas.addEventListener('wheel', e=>{ e.preventDefault(); SCALE=Math.max(10,Math.min(80,SCALE-e.deltaY*0.05)); draw(); },{passive:false});

// ── Inspector ──────────────────────────────────────────────────────────────
function refreshInspector(){
  const panel=document.getElementById('inspector');
  if(!selectedId){ panel.classList.remove('visible'); return; }
  const s=getShape(selectedId); if(!s){ panel.classList.remove('visible'); return; }
  panel.classList.add('visible');
  document.getElementById('inspTitle').textContent=`✎ ${s.name}`;
  document.getElementById('iName').value=s.name;
  document.getElementById('iX').value=s.cx;
  document.getElementById('iY').value=s.cy;
  document.getElementById('iZ').value=s.z;
  document.getElementById('iColor').value=s.color;
  document.getElementById('iColorHex').value=s.color;
  if(s.type==='rect'){
    document.getElementById('iRectFields').style.display='';
    document.getElementById('iCircleFields').style.display='none';
    document.getElementById('iH').value=s.h;
    document.getElementById('iW').value=s.w;
    document.getElementById('iRot').value=s.rot||0;
  } else {
    document.getElementById('iRectFields').style.display='none';
    document.getElementById('iCircleFields').style.display='';
    document.getElementById('iR').value=s.r;
  }
}

function updateSelected(key,val){
  if(!selectedId) return;
  const s=getShape(selectedId); if(!s) return;
  s[key]=val;
  buildList(); draw();
}

// ── List ───────────────────────────────────────────────────────────────────
function buildList(){
  const list=document.getElementById('shapeList');
  document.getElementById('shapeCount').textContent=shapes.length;
  if(!shapes.length){ list.innerHTML='<div class="empty-hint">No shapes yet.<br>Add one above.</div>'; return; }
  list.innerHTML='';
  for(const s of shapes){
    const card=document.createElement('div');
    card.className='shape-card'+(s.id===selectedId?' selected':'');
    const sub=s.type==='rect'
      ?`(${s.cx}, ${s.cy}) · h=${s.h} w=${s.w}${s.rot?` rot=${s.rot}°`:''}`
      :`(${s.cx}, ${s.cy}) · r=${s.r}`;
    card.innerHTML=`
      <div class="swatch" style="background:${s.color}"></div>
      <div class="card-info"><div class="card-name">${s.name}</div><div class="card-sub">${sub}</div></div>
      <button class="del-btn" title="Delete" onclick="deleteShape('${s.id}',event)">×</button>`;
    card.onclick=()=>{ selectedId=selectedId===s.id?null:s.id; buildList(); refreshInspector(); draw(); };
    list.appendChild(card);
  }
}

function deleteShape(id,e){
  e.stopPropagation();
  shapes=shapes.filter(s=>s.id!==id);
  if(selectedId===id) selectedId=null;
  buildList(); refreshInspector(); draw();
}

// ── Add form ───────────────────────────────────────────────────────────────
function setType(t){
  curType=t;
  document.getElementById('tabRect').classList.toggle('active',t==='rect');
  document.getElementById('tabCircle').classList.toggle('active',t==='circle');
  document.getElementById('rectFields').style.display=t==='rect'?'':'none';
  document.getElementById('circleFields').style.display=t==='circle'?'':'none';
}

document.getElementById('fColor').addEventListener('input',e=>{ document.getElementById('fColorHex').value=e.target.value; });
document.getElementById('fColorHex').addEventListener('input',e=>{ if(/^#[0-9a-fA-F]{6}$/.test(e.target.value)) document.getElementById('fColor').value=e.target.value; });

function addShape(){
  const name=document.getElementById('fName').value.trim()||('shape'+(shapes.length+1));
  const cx=parseFloat(document.getElementById('fX').value)||0;
  const cy=parseFloat(document.getElementById('fY').value)||0;
  const z=parseFloat(document.getElementById('fZ').value)||0;
  const color=document.getElementById('fColorHex').value||document.getElementById('fColor').value||'#22aa44';
  let s;
  if(curType==='rect'){
    const h=parseFloat(document.getElementById('fH').value)||2;
    const w=parseFloat(document.getElementById('fW').value)||2;
    const rot=parseFloat(document.getElementById('fRot').value)||0;
    s={id:uid(),name,type:'rect',cx,cy,z,h,w,rot,color};
  } else {
    const r=parseFloat(document.getElementById('fR').value)||1;
    s={id:uid(),name,type:'circle',cx,cy,z,r,color};
  }
  shapes.push(s);
  selectedId=s.id;
  document.getElementById('fName').value='';
  buildList(); refreshInspector(); draw();
  document.querySelector('.shape-list').scrollTop=99999;
}

document.querySelector('.add-form').addEventListener('keydown',e=>{ if(e.key==='Enter') addShape(); });

// ── Init ───────────────────────────────────────────────────────────────────
resize(); buildList(); refreshInspector();
</script>
</body>
</html>
